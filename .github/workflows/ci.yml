name: CI

# Amplify builds on push, which is after the merge - by then a red build is
# already deployed. This runs before, on the PR.
#
# Deliberately not run on the brand branches: most forked before the test suite
# existed and have no tests/ directory, so this would be permanently red on
# branches nobody can fix quickly. Add a brand branch here once it has the
# suite.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The brand theme is a build-time concern: a hardcoded palette colour
      # compiles fine and then ships the wrong brand. Cheap to catch here.
      - name: No hardcoded palette colours
        run: |
          # grep -r, not git grep: git grep skips untracked files, so a newly
          # added component would sail through. Proven by deliberately breaking it.
          if grep -rnE '\b(bg|text|ring|border|from|to|via)-(purple|indigo|violet|fuchsia|sky|teal|cyan)-[0-9]{2,3}\b' src; then
            echo "::error::Hardcoded palette colour found. Use brand-* so the brand branches can re-skin."
            exit 1
          fi
          echo "clean"
