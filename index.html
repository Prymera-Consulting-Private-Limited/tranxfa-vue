<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/fav.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xenvia</title>
  <!-- Loaded here rather than @import-ed from main.css: an @import inside the
       bundled stylesheet serialises the fetches - main.css must be parsed
       before the font request even starts. A link in the head runs both in
       parallel, and preconnect opens the TLS session while that happens. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
  <!-- #230: GA4 library deferred to after first paint via requestIdleCallback.
       SD-2059: Consent Mode v2 in advanced mode, as on xenvia.eu. All four
       signals start denied, so until the visitor accepts Google gets only its
       anonymous pings and sets no cookies. src/consent.js grants them on
       "Aceptar todas", and it alone loads the Meta Pixel and Clarity. Neither
       has a tag on this page, so neither can run before consent. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('consent', 'default', {
      'analytics_storage': 'denied',
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied'
    });
    gtag('js', new Date());
    gtag('config', 'G-09D5GXFFJ7', { send_page_view: false });
    (function () {
      function loadGA4() {
        var s = document.createElement('script');
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-09D5GXFFJ7';
        document.head.appendChild(s);
      }
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadGA4);
      } else {
        setTimeout(loadGA4, 2000);
      }
    })();
  </script>
</head>

<body class="min-h-screen">
  <div id="app" class="min-h-screen"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
